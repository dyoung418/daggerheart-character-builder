<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self';
    object-src 'none';
    base-uri 'none';
    form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Daggerheart — My Characters</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Daggerheart <span>My Characters</span></h1>
    <nav class="top-nav">
      <a href="index.html">Card Browser</a>
      <a href="create.html">New Character</a>
      <!-- Present on this page too, and last, exactly as on every other page: the words
           "My Characters" should mean one thing and sit in one place. characters.js intercepts
           it so returning to the roster doesn't reload; the href is what makes it a real link. -->
      <a href="characters.html" id="nav-my-characters">My Characters</a>
    </nav>
  </header>

  <div class="characters-layout">
    <div class="characters-toolbar">
      <button id="export-csv-btn" class="btn-ghost export-csv-btn">Export CSV for the GM</button>
      <button id="transfer-btn" class="btn-ghost export-csv-btn">Backup &amp; transfer</button>
    </div>
    <!-- Upstream's JSON import/export buttons are deliberately absent: Backup & transfer above is
         the fork's own round-trip, and two file formats side by side would be a trap. The hidden
         portrait input and the banner stay — the portrait feature came in with the play page and
         reports its failures through #import-banner. -->
    <input id="portrait-file" type="file" accept="image/*" hidden />
    <div id="import-banner" class="import-banner" hidden></div>
    <div id="characters-list" class="characters-list"></div>
    <div id="character-detail" class="character-detail"></div>
  </div>

  <script type="module" src="characters.js"></script>
</body>
</html>
